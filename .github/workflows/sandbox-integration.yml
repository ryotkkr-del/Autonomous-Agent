name: Docker sandbox integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      AGENT_TEST_LIVE_DOCKER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch official Python sandbox image
        run: docker pull python:3.11-slim
      - name: Verify host write and network restrictions
        run: python -m unittest discover -s tests -p test_docker_integration.py -v
