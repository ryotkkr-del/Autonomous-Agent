name: Docker sandbox integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      AGENT_TEST_LIVE_DOCKER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Fetch official Python sandbox image
        run: docker pull python:3.11-slim@sha256:07d4824036af339fa1b6ef769cc99d9c10a141769538b52b3b597c84f7a7b535
      - name: Verify host write and network restrictions
        run: python -m unittest discover -s tests -p test_docker_integration.py -v
